<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ana y José Tulum - Menú Digital</title>
    <style>
        :root { --oro: #8d754a; --oscuro: #2c3e50; --beige: #f9f7f2; --blanco: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--beige); margin: 0; padding: 10px; color: #333; }
        .container { max-width: 800px; margin: auto; background: var(--blanco); border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        .hero { 
            width: 100%; height: 200px; 
            background-image: url('https://r2.erweima.ai/i/1000108113.jpg'); 
            background-size: cover; background-position: center;
            display: flex; align-items: flex-end;
        }
        .hero-title { background: linear-gradient(transparent, rgba(0,0,0,0.8)); width: 100%; padding: 20px; color: white; text-align: center; }
        .hero-title h1 { margin: 0; letter-spacing: 3px; font-size: 1.5rem; text-transform: uppercase; }

        .nav-menu { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 15px; position: sticky; top: 0; background: white; z-index: 100; border-bottom: 1px solid #eee; }
        .btn-cat { border: 1.5px solid var(--oro); background: white; color: var(--oro); padding: 7px 14px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.85rem; transition: 0.3s; }
        .btn-cat.active { background: var(--oro); color: white; }

        .content { padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media(min-width: 600px) { .grid { grid-template-columns: 1fr 1fr; } }
        
        .card { border: 1px solid #eee; padding: 15px; border-radius: 12px; display: flex; flex-direction: column; justify-content: space-between; background: #fff; transition: 0.2s; }
        .card:hover { border-color: var(--oro); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .card-info { display: flex; justify-content: space-between; font-weight: bold; color: var(--oscuro); margin-bottom: 5px; }
        .precio { color: var(--oro); }
        .desc { font-size: 0.8rem; color: #777; margin-bottom: 12px; font-style: italic; min-height: 35px; line-height: 1.2; }
        .btn-add { background: var(--oscuro); color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        .canasta { background: #fdfcf9; border-top: 3px solid var(--oro); padding: 20px; margin-top: 20px; }
        .form-group { margin-bottom: 12px; }
        label { font-weight: bold; font-size: 0.85rem; color: var(--oscuro); }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; font-family: inherit; }

        .items-lista { margin: 15px 0; border-top: 1px solid #eee; }
        .item-carrito { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .btn-del { color: #e74c3c; border: none; background: none; cursor: pointer; font-weight: bold; }
        
        .total-row { display: flex; justify-content: space-between; margin: 15px 0; font-size: 1.3rem; font-weight: bold; }
        .btn-whatsapp { background: #25D366; color: white; border: none; width: 100%; padding: 15px; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="hero">
        <div class="hero-title">
            <h1>Ana y José</h1>
            <p>The Good Life • Tulum</p>
        </div>
    </div>

    <div class="nav-menu">
        <button class="btn-cat active" data-cat="Desayuno">Desayunos</button>
        <button class="btn-cat" data-cat="Lunch">Almuerzos</button>
        <button class="btn-cat" data-cat="Cena">Cenas</button>
        <button class="btn-cat" data-cat="Mixología">Mixología</button>
        <button class="btn-cat" data-cat="Clásicos">Cocteles</button>
        <button class="btn-cat" data-cat="Bebidas">Sin Alcohol</button>
    </div>

    <div class="content">
        <div id="menu-grid" class="grid"></div>
    </div>

    <div class="canasta">
        <h3>🛒 Tu Pedido / Your Order</h3>
        
        <div class="form-group">
            <label>Nombre / Name:</label>
            <input type="text" id="nombre-huesped" placeholder="Escriba su nombre">
        </div>
        
        <div class="form-group">
            <label>Habitación / Room:</label>
            <input type="text" id="habitacion" placeholder="Ej: Villa 01">
        </div>

        <div class="form-group">
            <label>Forma de Pago / Payment Method:</label>
            <select id="forma-pago">
                <option value="Cargo a la Habitación">Cargo a la Habitación / Charge to Room</option>
                <option value="Tarjeta al recibir">Tarjeta al recibir / Credit Card on Delivery</option>
                <option value="Efectivo">Efectivo / Cash</option>
            </select>
        </div>

        <div id="cart-items" class="items-lista"></div>
        
        <div class="total-row">
            <span>Total:</span>
            <span>$<span id="total-val">0</span> MXN</span>
        </div>
        
        <button class="btn-whatsapp" onclick="enviar()">Confirmar Pedido</button>
    </div>
</div>

<script>
    const platillos = [
        // DESAYUNOS
        { n: "Huevos Doña Ana", p: 295, d: "Sobre sope de maíz azul, frijol colado y salsa recado negro.", c: "Desayuno" },
        { n: "Chilaquiles Tradicionales", p: 250, d: "Bañados en salsa verde o roja, con crema fresca y aguacate.", c: "Desayuno" },
        { n: "Avocado Toast Tulum", p: 350, d: "Pan de masa madre, tomate heirloom y huevo pochado orgánico.", c: "Desayuno" },
        { n: "Hot Cakes Plátano", p: 275, d: "Con miel melipona y frutos rojos de la estación.", c: "Desayuno" },
        { n: "Omelette de Claras", p: 285, d: "Relleno de espinacas y queso de cabra con guarnición verde.", c: "Desayuno" },

        // ALMUERZOS (LUNCH)
        { n: "Guacamole del Huerto", p: 280, d: "Con totopos de maíz azul y plátano macho frito.", c: "Lunch" },
        { n: "Hamburguesa Ana y José", p: 545, d: "Carne Angus, queso gouda y alioli de xcatic.", c: "Lunch" },
        { n: "Tacos de Rib Eye", p: 495, d: "3 piezas al carbón con tortillas hechas a mano.", c: "Lunch" },
        { n: "Ceviche de Pescado", p: 485, d: "Marinado en lima, cilantro y chile habanero.", c: "Lunch" },
        { n: "Tacos de Camarón Tempura", p: 460, d: "Con col morada y aderezo chipotle cremoso.", c: "Lunch" },

        // CENAS
        { n: "Carpaccio Wagyu", p: 1105, d: "Con aceite de trufa blanca y lajas de parmesano.", c: "Cena" },
        { n: "Langosta al Horno", p: 1350, d: "Con mantequilla de cítricos y puré de camote.", c: "Cena" },
        { n: "Pulpo a la Brasa", p: 550, d: "Con crema de pimentón y papas cambray al romero.", c: "Cena" },
        { n: "Filete al Carbón", p: 980, d: "Corte Prime con espárragos y puré de papa trufado.", c: "Cena" },
        { n: "Pasta Frutti di Mare", p: 620, d: "Mariscos frescos salteados en vino blanco y ajo.", c: "Cena" },

        // MIXOLOGÍA
        { n: "Mezcalita Maracuyá", p: 320, d: "Mezcal artesanal, maracuyá fresca y sal de gusano.", c: "Mixología" },
        { n: "Maya Tonic", p: 310, d: "Gin, infusión de chaya, pepino y tónica premium.", c: "Mixología" },
        { n: "Carajillo Maya", p: 285, d: "Licor 43, espresso y un toque de canela regional.", c: "Mixología" },
        { n: "Tulum Mule", p: 315, d: "Vodka, jengibre fresco, limón y cerveza de jengibre.", c: "Mixología" },

        // CLÁSICOS
        { n: "Margarita Tradicional", p: 290, d: "Tequila reposado, triple sec y jugo de limón.", c: "Clásicos" },
        { n: "Piña Colada", p: 275, d: "Ron blanco, crema de coco y piña natural.", c: "Clásicos" },
        { n: "Aperol Spritz", p: 310, d: "Aperol, Prosecco y un toque de soda.", c: "Clásicos" },
        { n: "Mojito Clásico", p: 280, d: "Ron, hierbabuena fresca, azúcar y lima.", c: "Clásicos" },

        // SIN ALCOHOL
        { n: "Jugo Verde", p: 155, d: "Piña, chaya, apio y naranja natural.", c: "Bebidas" },
        { n: "Limonada Chaya", p: 125, d: "Refrescante combinación local.", c: "Bebidas" },
        { n: "Smoothie Coco", p: 165, d: "Coco natural y un toque de vainilla.", c: "Bebidas" },
        { n: "Agua Evian 750ml", p: 140, d: "Agua mineral natural de manantial.", c: "Bebidas" }
    ];

    let carrito = [];

    function filtrar(cat) {
        document.querySelectorAll('.btn-cat').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
        const grid = document.getElementById('menu-grid');
        grid.innerHTML = platillos.filter(p => p.c === cat).map(p => `
            <div class="card">
                <div>
                    <div class="card-info"><span>${p.n}</span><span class="precio">$${p.p}</span></div>
                    <div class="desc">${p.d}</div>
                </div>
                <button class="btn-add" onclick="agregar('${p.n}', ${p.p})">Añadir</button>
            </div>
        `).join('');
    }

    function agregar(n, p) {
        carrito.push({n, p});
        renderCart();
    }

    function renderCart() {
        const box = document.getElementById('cart-items');
        if (carrito.length === 0) {
            box.innerHTML = '<p style="text-align:center;color:#999;font-size:0.8rem;">Canasta vacía</p>';
            document.getElementById('total-val').innerText = "0";
            return;
        }
        box.innerHTML = carrito.map((item, i) => `
            <div class="item-carrito">
                <span>${item.n}</span>
                <span>$${item.p} <button onclick="quitar(${i})" class="btn-del">✕</button></span>
            </div>
        `).join('');
        document.getElementById('total-val').innerText = carrito.reduce((s, i) => s + i.p, 0).toLocaleString();
    }

    function quitar(i) {
        carrito.splice(i, 1);
        renderCart();
    }

    function enviar() {
        const nombre = document.getElementById('nombre-huesped').value;
        const hab = document.getElementById('habitacion').value;
        const pago = document.getElementById('forma-pago').value;
        if(!nombre || !hab || carrito.length === 0) return alert("Por favor complete sus datos y añada productos.");

        let msg = `*PEDIDO ROOM SERVICE*%0A*Nombre:* ${nombre}%0A*Habitación:* ${hab}%0A*Pago:* ${pago}%0A%0A*PRODUCTOS:*%0A`;
        carrito.forEach(item => msg += `- ${item.n} ($${item.p})%0A`);
        msg += `%0A*TOTAL: $${document.getElementById('total-val').innerText} MXN*`;

        window.open(`https://wa.me/5219841234567?text=${msg}`, '_blank');
    }

    document.querySelectorAll('.btn-cat').forEach(b => b.onclick = () => filtrar(b.dataset.cat));
    renderCart();
    filtrar('Desayuno');
</script>

</body>
</html>
