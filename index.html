<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ana y José Tulum - Room Service Elite</title>
    <style>
        :root { --oro: #8d754a; --oscuro: #2c3e50; --beige: #f9f7f2; --blanco: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--beige); margin: 0; padding: 10px; color: #333; }
        .container { max-width: 800px; margin: auto; background: var(--blanco); border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        /* Hero Banner */
        .hero { 
            width: 100%; height: 220px; 
            background-image: url('https://r2.erweima.ai/i/1000108113.jpg'); 
            background-size: cover; background-position: center;
            display: flex; align-items: flex-end;
        }
        .hero-title { background: linear-gradient(transparent, rgba(0,0,0,0.8)); width: 100%; padding: 25px; color: white; text-align: center; }
        .hero-title h1 { margin: 0; letter-spacing: 4px; font-size: 1.6rem; text-transform: uppercase; }

        /* Navegación */
        .nav-menu { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 15px; position: sticky; top: 0; background: white; z-index: 100; border-bottom: 1px solid #eee; }
        .btn-cat { border: 1.5px solid var(--oro); background: white; color: var(--oro); padding: 8px 18px; border-radius: 25px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-cat.active { background: var(--oro); color: white; }

        /* Grid */
        .content { padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media(min-width: 600px) { .grid { grid-template-columns: 1fr 1fr; } }
        
        .card { border: 1px solid #eee; padding: 15px; border-radius: 12px; display: flex; flex-direction: column; justify-content: space-between; background: #fff; }
        .card-info { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; color: var(--oscuro); }
        .precio { color: var(--oro); }
        .desc { font-size: 0.85rem; color: #666; margin-bottom: 15px; }
        .btn-add { background: var(--oscuro); color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* Formulario de Datos del Huésped */
        .order-box { background: #fdfcf9; border-top: 2px solid var(--oro); padding: 25px; margin-top: 20px; }
        .form-row { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 15px; }
        @media(min-width: 600px) { .form-row { grid-template-columns: 1fr 1fr; } }
        
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 0.85rem; color: var(--oscuro); }
        input, select { padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 1rem; outline: none; }
        input:focus { border-color: var(--oro); }

        .item-cart { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 0.9rem; }
        .total-row { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; font-size: 1.4rem; font-weight: bold; }
        
        .btn-whatsapp { background: #25D366; color: white; border: none; width: 100%; padding: 18px; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="hero">
        <div class="hero-title">
            <h1>Ana y José</h1>
            <p>Room Service Experience</p>
        </div>
    </div>

    <div class="nav-menu">
        <button class="btn-cat active" data-cat="Desayuno">Desayunos</button>
        <button class="btn-cat" data-cat="Lunch">Lunch</button>
        <button class="btn-cat" data-cat="Cena">Cena</button>
        <button class="btn-cat" data-cat="Bebidas">Bebidas</button>
    </div>

    <div class="content">
        <div id="menu-grid" class="grid"></div>
    </div>

    <div class="order-box">
        <h3>Datos del Pedido</h3>
        
        <div class="form-row">
            <div class="form-group">
                <label>Nombre Completo / Full Name:</label>
                <input type="text" id="nombre-huesped" placeholder="Ej. Juan Pérez" required>
            </div>
            <div class="form-group">
                <label>Número de Habitación / Room:</label>
                <input type="text" id="habitacion" placeholder="Ej. Villa 10" required>
            </div>
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
            <label>Método de Pago:</label>
            <select id="pago">
                <option value="Cargo a la Habitación">Cargo a la Habitación</option>
                <option value="Pago al recibir (Efectivo/Tarjeta)">Pago al recibir (Efectivo/Tarjeta)</option>
            </select>
        </div>

        <h4>Tu Selección:</h4>
        <div id="cart-items"></div>
        
        <div class="total-row">
            <span>Total:</span>
            <span>$<span id="total-val">0</span> MXN</span>
        </div>
        
        <button class="btn-whatsapp" onclick="enviar()">
            Confirmar Pedido vía WhatsApp
        </button>
    </div>
</div>

<script>
    const WHATSAPP_NUMBER = "5219841234567"; // CAMBIA ESTO

    const platillos = [
        { n: "Huevos Doña Ana", p: 295, d: "Sope de maíz azul, frijol colado y salsa recado negro.", c: "Desayuno" },
        { n: "Chilaquiles Tradicionales", p: 250, d: "Verdes o rojos con crema, aguacate y frijoles.", c: "Desayuno" },
        { n: "Avocado Toast Tulum", p: 350, d: "Pan de masa madre, tomate heirloom y huevo pochado.", c: "Desayuno" },
        { n: "Hamburguesa Ana y José", p: 545, d: "Carne Angus, queso gouda y alioli xcatic.", c: "Lunch" },
        { n: "Tacos de Rib Eye", p: 495, d: "3 piezas al carbón con guacamole artesanal.", c: "Lunch" },
        { n: "Carpaccio Res Wagyu", p: 1105, d: "Aceite de trufa y lajas de parmesano.", c: "Cena" },
        { n: "Langosta al Horno", p: 1350, d: "Con mantequilla de cítricos y puré de maíz.", c: "Cena" },
        { n: "Jugo Verde Maya", p: 155, d: "Chaya, piña, pepino y miel melipona.", c: "Bebidas" }
    ];

    let carrito = [];

    function filtrar(cat) {
        document.querySelectorAll('.btn-cat').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
        const grid = document.getElementById('menu-grid');
        grid.innerHTML = platillos.filter(p => p.c === cat).map(p => `
            <div class="card">
                <div>
                    <div class="card-info"><span>${p.n}</span><span class="precio">$${p.p}</span></div>
                    <div class="desc">${p.d}</div>
                </div>
                <button class="btn-add" onclick="agregar('${p.n}', ${p.p})">Añadir al Pedido</button>
            </div>
        `).join('');
    }

    function agregar(n, p) {
        carrito.push({n, p});
        renderCart();
    }

    function renderCart() {
        const box = document.getElementById('cart-items');
        box.innerHTML = carrito.map((item, i) => `
            <div class="item-cart">
                <span>${item.n}</span>
                <span>$${item.p} <button onclick="quitar(${i})" style="border:none;background:none;color:red;cursor:pointer">✕</button></span>
            </div>
        `).join('');
        document.getElementById('total-val').innerText = carrito.reduce((s, i) => s + i.p, 0).toLocaleString();
    }

    function quitar(i) {
        carrito.splice(i, 1);
        renderCart();
    }

    function enviar() {
        const nombre = document.getElementById('nombre-huesped').value;
        const hab = document.getElementById('habitacion').value;
        const pago = document.getElementById('pago').value;
        const total = document.getElementById('total-val').innerText;

        if(!nombre || !hab) return alert("Por favor complete su nombre y número de habitación.");
        if(carrito.length === 0) return alert("El carrito está vacío.");

        let msg = `*NUEVO PEDIDO DE ROOM SERVICE*%0A`;
        msg += `--------------------------%0A`;
        msg += `*Huésped:* ${nombre}%0A`;
        msg += `*Habitación:* ${hab}%0A`;
        msg += `*Pago:* ${pago}%0A`;
        msg += `--------------------------%0A`;
        msg += `*PEDIDO:*%0A`;
        carrito.forEach(item => msg += `• ${item.n} ($${item.p})%0A`);
        msg += `--------------------------%0A`;
        msg += `*TOTAL A PAGAR: $${total} MXN*`;

        window.open(`https://wa.me/${9841862451}?text=${msg}`, '_blank');
    }

    document.querySelectorAll('.btn-cat').forEach(b => {
        b.dataset.cat = b.innerText === "Almuerzos" ? "Lunch" : (b.innerText === "Cenas" ? "Cena" : b.innerText);
        b.onclick = () => filtrar(b.dataset.cat);
    });
    
    // Ajuste manual de data-cat para que coincidan los nombres
    document.querySelector('[data-cat="Desayunos"]').dataset.cat = "Desayuno";
    
    filtrar('Desayuno');
</script>

</body>
</html>
