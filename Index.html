<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ana y José Tulum - Room Service Pro</title>
    <style>
        :root { --oro: #8d754a; --oscuro: #2c3e50; --beige: #f9f7f2; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--beige); margin: 0; padding: 10px; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        
        header { text-align: center; border-bottom: 2px solid var(--oro); margin-bottom: 20px; padding-bottom: 15px; }
        h1 { color: var(--oro); letter-spacing: 3px; margin: 0; font-size: 1.8rem; }

        /* Categorías con Imagen de Fondo */
        .nav-menu { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px; position: sticky; top: 0; background: white; padding: 15px 0; z-index: 100; }
        .btn-cat { border: 1.5px solid var(--oro); background: white; color: var(--oro); padding: 10px 20px; border-radius: 25px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-cat.active { background: var(--oro); color: white; }

        /* Banner de Categoría */
        #category-banner { width: 100%; height: 150px; border-radius: 10px; background-size: cover; background-position: center; margin-bottom: 20px; transition: 0.5s; }

        /* Menú */
        .lista-productos { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media(min-width: 600px) { .lista-productos { grid-template-columns: 1fr 1fr; } }
        
        .producto-card { border: 1px solid #eee; padding: 15px; border-radius: 12px; display: flex; flex-direction: column; justify-content: space-between; background: #fff; transition: 0.2s; }
        .producto-card:hover { border-color: var(--oro); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .producto-info { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; }
        .precio { color: var(--oro); }
        .btn-add { background: var(--oscuro); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }

        /* Formulario de Detalles */
        .detalles-pedido { background: #fdfcf9; border: 1px solid #e0dacc; padding: 20px; border-radius: 12px; margin-top: 30px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: var(--oscuro); }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }

        /* Carrito */
        .carrito { margin-top: 20px; padding: 15px; border-top: 1px solid #eee; }
        .item-carrito { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
        .total { text-align: right; font-size: 1.5rem; font-weight: bold; margin-top: 20px; color: var(--oscuro); }
        
        .btn-whatsapp { background: #25D366; color: white; border: none; width: 100%; padding: 18px; border-radius: 10px; font-size: 1.2rem; font-weight: bold; margin-top: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-whatsapp:hover { background: #128C7E; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ANA Y JOSÉ TULUM</h1>
        <p>The Good Life - Room Service</p>
    </header>

    <div class="nav-menu">
        <button class="btn-cat active" data-cat="Desayuno">Desayunos</button>
        <button class="btn-cat" data-cat="Lunch">Lunch</button>
        <button class="btn-cat" data-cat="Cena">Cena</button>
        <button class="btn-cat" data-cat="Bebidas">Bebidas</button>
    </div>

    <div id="category-banner"></div>

    <div id="contenedor-menu" class="lista-productos"></div>

    <div class="detalles-pedido">
        <h3>Datos de Entrega y Pago</h3>
        <div class="form-group">
            <label>Número de Habitación / Room Number:</label>
            <input type="text" id="habitacion" placeholder="Ej. 104" required>
        </div>
        <div class="form-group">
            <label>Método de Pago / Payment Method:</label>
            <select id="metodo-pago">
                <option value="Cargo a la Habitación">Cargo a la Habitación</option>
                <option value="Pago al recibir (Efectivo/Tarjeta)">Pago al recibir (Efectivo/Tarjeta)</option>
            </select>
        </div>

        <div class="carrito">
            <h4>Tu Selección:</h4>
            <div id="items-carrito"></div>
            <div class="total">Total: $<span id="suma-total">0</span> MXN</div>
            
            <button class="btn-whatsapp" onclick="enviarWhatsApp()">
                Confirmar por WhatsApp
            </button>
        </div>
    </div>
</div>

<script>
    // Configuración: Cambia este número por el del hotel (incluye código de país, ej: 52984...)
    const TELEFONO_HOTEL = "5219841234567"; 

    const menu = [
        { n: "Huevos Doña Ana", p: 295, c: "Desayuno" },
        { n: "Chilaquiles Tradicionales", p: 250, c: "Desayuno" },
        { n: "Avocado Toast Tulum", p: 350, c: "Desayuno" },
        { n: "Enchiladas de Cochinita", p: 305, c: "Desayuno" },
        { n: "Panqueques de Cacao", p: 285, c: "Desayuno" },
        { n: "Guacamole con Rib Eye", p: 305, c: "Lunch" },
        { n: "Ceviche de Pescado", p: 485, c: "Lunch" },
        { n: "Hamburguesa Ana y José", p: 545, c: "Lunch" },
        { n: "Pizza Caribeña Langosta", p: 765, c: "Lunch" },
        { n: "Carpaccio de Res Wagyu", p: 1105, c: "Cena" },
        { n: "Ribeye Prime Madurado", p: 2250, c: "Cena" },
        { n: "Langosta al Carbón", p: 1350, c: "Cena" },
        { n: "Filete de Mero en Costra", p: 505, c: "Cena" },
        { n: "Jugo Verde Maya", p: 155, c: "Bebidas" },
        { n: "Tónico de Fuego", p: 155, c: "Bebidas" },
        { n: "Smoothie Tropical", p: 165, c: "Bebidas" }
    ];

    const banners = {
        "Desayuno": "https://images.unsplash.com/photo-1533089860892-a7c6f0a88666?auto=format&fit=crop&w=800&q=80",
        "Lunch": "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800&q=80",
        "Cena": "https://images.unsplash.com/photo-1559339352-11d035aa65de?auto=format&fit=crop&w=800&q=80",
        "Bebidas": "https://images.unsplash.com/photo-1544145945-f904253db0ad?auto=format&fit=crop&w=800&q=80"
    };

    let carrito = [];

    function filtrar(categoria) {
        const contenedor = document.getElementById('contenedor-menu');
        const banner = document.getElementById('category-banner');
        contenedor.innerHTML = '';
        
        banner.style.backgroundImage = `url('${banners[categoria]}')`;
        
        const filtrados = menu.filter(item => item.c === categoria);
        filtrados.forEach(item => {
            const div = document.createElement('div');
            div.className = 'producto-card';
            div.innerHTML = `
                <div class="producto-info">
                    <span>${item.n}</span>
                    <span class="precio">$${item.p}</span>
                </div>
                <button class="btn-add" onclick="agregar('${item.n}', ${item.p})">Añadir al Pedido</button>
            `;
            contenedor.appendChild(div);
        });
    }

    function agregar(nombre, precio) {
        carrito.push({ nombre, precio });
        actualizarCarrito();
    }

    function actualizarCarrito() {
        const lista = document.getElementById('items-carrito');
        const totalHtml = document.getElementById('suma-total');
        lista.innerHTML = '';
        let suma = 0;
        carrito.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'item-carrito';
            div.innerHTML = `<span>${item.nombre}</span> <span>$${item.precio} <button onclick="quitar(${index})" style="color:red; border:none; background:none; cursor:pointer; font-weight:bold;">✕</button></span>`;
            lista.appendChild(div);
            suma += item.precio;
        });
        totalHtml.innerText = suma.toLocaleString();
    }

    function quitar(idx) {
        carrito.splice(idx, 1);
        actualizarCarrito();
    }

    function enviarWhatsApp() {
        const habitacion = document.getElementById('habitacion').value;
        const pago = document.getElementById('metodo-pago').value;
        const total = document.getElementById('suma-total').innerText;

        if (!habitacion) {
            alert("Por favor, ingresa tu número de habitación.");
            return;
        }
        if (carrito.length === 0) {
            alert("Tu pedido está vacío.");
            return;
        }

        // Construir mensaje de WhatsApp
        let mensaje = `*PEDIDO ROOM SERVICE - ANA Y JOSÉ*%0A%0A`;
        mensaje += `*Habitación:* ${habitacion}%0A`;
        mensaje += `*Método de Pago:* ${pago}%0A`;
        mensaje += `--------------------------%0A`;
        
        carrito.forEach(item => {
            mensaje += `• ${item.nombre} - $${item.precio}%0A`;
        });

        mensaje += `--------------------------%0A`;
        mensaje += `*TOTAL:* $${total} MXN%0A%0A`;
        mensaje += `_Por favor, confirme la recepción de este pedido._`;

        // Abrir WhatsApp con el mensaje
        const url = `https://wa.me/${529841862451}?text=${mensaje}`;
        window.open(url, '_blank');
    }

    document.addEventListener('DOMContentLoaded', () => {
        const botones = document.querySelectorAll('.btn-cat');
        botones.forEach(boton => {
            boton.addEventListener('click', () => {
                botones.forEach(b => b.classList.remove('active'));
                boton.classList.add('active');
                filtrar(boton.getAttribute('data-cat'));
            });
        });
        filtrar('Desayuno');
    });
</script>

</body>
</html>
